<title>Mini Japan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root {
  color-scheme: light;
  --paper: #FFFFFF; --ink: #0B1F3A; --muted: #4B5C74; --rule: #D8DFEA; --teal: #1B3C7B; --base: #8A9AB2;
  --teal-soft: rgba(27,60,123,.14);
  --ja: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --en: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ja); font-size: 16px; line-height: 1.85;
  padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
html[lang="en"] body { font-family: var(--en); line-height: 1.65; }
.page { max-width: 1120px; margin-inline: auto; padding-block: 18px 72px; }
h1, h2, h3, p, ul, dl, dd, figure { margin: 0; }
.nb { white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.brand { font-weight: 700; font-size: 17px; }
.lang { display: flex; gap: 16px; }
.pick { background: none; border: 0; padding: 0; cursor: pointer; color: var(--teal); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.pick[aria-pressed="true"] { color: var(--ink); font-weight: 700; text-decoration-thickness: 2px; text-decoration-color: var(--teal); }

h1 { margin-top: 56px; font-size: clamp(28px, 4.8vw, 48px); line-height: 1.25; font-weight: 700; max-width: 20em; text-wrap: balance; }
html[lang="en"] h1 { letter-spacing: -.015em; max-width: 18em; }
.intro { margin-top: 20px; max-width: 40em; font-size: 17px; text-wrap: pretty; }
.intro + .intro { margin-top: 10px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; margin-top: 44px; align-items: start; }
@media (max-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr); gap: 40px; } }

.yearrow { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.bigyear { font-size: clamp(60px, 11vw, 104px); font-weight: 700; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ysub { color: var(--muted); padding-bottom: 6px; }
svg { display: block; width: 100%; height: auto; }
#pyr { margin-top: 12px; min-height: 380px; }
.scrub { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
.play { min-width: 4.5em; padding: 4px 14px; border: 1px solid var(--ink); border-radius: 3px; background: none; cursor: pointer; }
.play:hover { background: var(--ink); color: var(--paper); }
input[type=range] { width: 100%; accent-color: var(--teal); margin: 8px 0; }
.note { color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 44em; text-wrap: pretty; }
.scrub + .note { margin-top: 6px; }

.diff { margin-top: 28px; display: grid; gap: 2px; max-width: 600px; }
.diff > div { display: grid; grid-template-columns: minmax(0, 1fr) 8.5em 8.5em; gap: 0 12px; align-items: baseline; }
.diff dt { color: var(--ink); }
.diff dd { font-variant-numeric: tabular-nums; text-align: right; }
.diff .d { color: var(--muted); }
.diff .dh { font-size: 13px; color: var(--muted); font-weight: 700; } .diff .dh span { text-align: right; }
.diff .gap { height: 8px; display: block; }
@media (max-width: 520px) { .diff > div { grid-template-columns: minmax(0, 1fr) 6.8em 6.8em; gap: 0 8px; font-size: 14.5px; } }

.controls h2 { font-size: 22px; line-height: 1.4; }
.picks { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; line-height: 1.7; }
.grp { margin-top: 30px; font-size: 15px; font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.ctl { margin-top: 18px; }
.ctl label { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; line-height: 1.5; }
.ctl output { font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--teal); }
.hint { display: block; color: var(--muted); font-size: 13px; line-height: 1.6; }
details { margin-top: 30px; }
summary { cursor: pointer; color: var(--teal); text-decoration: underline; text-underline-offset: 4px; }
details .ctl:first-of-type { margin-top: 14px; }
#status { margin-top: 24px; color: var(--muted); font-size: 13px; }

section.s { margin-top: 80px; }
section.s h2 { font-size: 26px; line-height: 1.4; max-width: 24em; text-wrap: balance; }
section.s > p { margin-top: 10px; max-width: 42em; text-wrap: pretty; }
section.s > p.note { margin-top: 10px; }
.grid { margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 40px; }
.grid + h3.gh { margin-top: 56px; }
h3.gh { font-size: 20px; line-height: 1.5; margin-top: 44px; }
h3.gh + p { margin-top: 4px; max-width: 42em; color: var(--muted); font-size: 14px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
figure h3 { font-size: 18px; line-height: 1.5; }
figure .cap { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin-top: 2px; max-width: 34em; }
.ro { margin-top: 8px; min-height: 1.7em; font-size: 14px; font-variant-numeric: tabular-nums; }

.gridline { stroke: var(--rule); stroke-width: 1; } .axis { stroke: var(--muted); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; } .agelab { fill: var(--muted); font-size: 11px; }
.head { fill: var(--ink); font-size: 13px; font-weight: 700; }
.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ln-you { stroke: var(--teal); stroke-width: 2.6; } .ln-base { stroke: var(--base); stroke-width: 1.7; }
.ln-ipss { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dot-ipss { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.band { fill: var(--teal-soft); } .sel { stroke: var(--ink); stroke-width: 1; opacity: .35; } .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.lab-you { fill: var(--teal); font-size: 12px; font-weight: 700; } .lab-base { fill: var(--muted); font-size: 12px; } .lab-ipss { fill: var(--ink); font-size: 12px; }
.mk { stroke: var(--ink); stroke-width: 1.6; fill: none; } .mk-dot { fill: var(--ink); } .mk-txt { fill: var(--ink); font-size: 11px; }
.zero { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.bar { fill: var(--teal); opacity: .82; } .bar-base { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.chart { cursor: crosshair; }

.tablewrap { margin-top: 24px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.5; }
#cmp { min-width: 820px; } #check { min-width: 520px; } #anchors { min-width: 560px; }
th, td { padding: 10px 14px 10px 0; text-align: right; vertical-align: top; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
th { font-size: 13px; color: var(--muted); font-weight: 700; }
th:first-child, td:first-child { text-align: left; min-width: 12em; padding-right: 20px; }
#anchors td:nth-child(2), #anchors th:nth-child(2) { text-align: left; }
td.best { font-weight: 700; }
tr.sep td { border-top: 2px solid var(--ink); }
.prose { margin-top: 20px; max-width: 42em; text-wrap: pretty; }
.prose + .prose { margin-top: 12px; }
dl.gl { margin-top: 24px; display: grid; gap: 18px 0; max-width: 44em; }
dl.gl dt { font-weight: 700; }
dl.gl dd { color: var(--ink); }
ul.limits { margin-top: 18px; padding-left: 1.2em; max-width: 44em; display: grid; gap: 10px; }
.src a { color: var(--teal); text-underline-offset: 3px; }
.src { max-width: 46em; }
footer { margin-top: 80px; color: var(--muted); font-size: 13px; max-width: 46em; }
</style>

<div class="page">
  <header class="top">
    <span class="brand" data-i18n="brand"></span>
    <div class="lang" role="group" aria-label="Language">
      <button class="pick" data-lang="ja" aria-pressed="true">日本語</button>
      <button class="pick" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <h1 data-i18n="h1"></h1>
  <p class="intro" data-i18n="intro1"></p>
  <p class="intro" data-i18n="intro2"></p>

  <div class="stage">
    <div>
      <div class="yearrow"><div class="bigyear" id="bigyear">2070</div><div class="ysub" id="ysub"></div></div>
      <svg id="pyr" role="img"></svg>
      <div class="scrub">
        <button class="play" id="play" type="button"></button>
        <input id="year" type="range" min="2020" max="2070" step="1" value="2070">
      </div>
      <p class="note" data-i18n="pyrKey"></p>
      <dl class="diff" id="diff"></dl>
    </div>

    <form class="controls" onsubmit="return false">
      <h2 data-i18n="cond"></h2>
      <div class="picks" id="presets" role="group">
        <button class="pick" type="button" data-p="base" aria-pressed="false" data-i18n="p_base"></button>
        <button class="pick" type="button" data-p="trend" aria-pressed="false" data-i18n="p_trend"></button>
        <button class="pick" type="button" data-p="imm10" aria-pressed="true" data-i18n="p_imm"></button>
        <button class="pick" type="button" data-p="births10" aria-pressed="false" data-i18n="p_births"></button>
        <button class="pick" type="button" data-p="ret68" aria-pressed="false" data-i18n="p_ret"></button>
        <button class="pick" type="button" data-p="tax15" aria-pressed="false" data-i18n="p_tax"></button>
        <button class="pick" type="button" data-p="infl3" aria-pressed="false" data-i18n="p_infl"></button>
        <button class="pick" type="button" data-p="yld4" aria-pressed="false" data-i18n="p_yld"></button>
        <button class="pick" type="button" data-p="prod15" aria-pressed="false" data-i18n="p_prod"></button>
      </div>

      <div class="grp" data-i18n="g_pop"></div>
      <div class="ctl"><label for="tfr"><span data-i18n="l_tfr"></span><output id="o-tfr"></output></label>
        <input id="tfr" type="range" min="-0.4" max="0.6" step="0.01" value="0"><span class="hint" id="h-tfr"></span></div>
      <div class="ctl"><label for="imm"><span data-i18n="l_imm"></span><output id="o-imm"></output></label>
        <input id="imm" type="range" min="0" max="45" step="0.1" value="16.4"><span class="hint" data-i18n="h_imm"></span></div>
      <div class="ctl"><label for="marr"><span data-i18n="l_marr"></span><output id="o-marr"></output></label>
        <input id="marr" type="range" min="0.8" max="1.15" step="0.01" value="1"><span class="hint" id="h-marr"></span></div>

      <div class="grp" data-i18n="g_pen"></div>
      <div class="ctl"><label for="ret"><span data-i18n="l_ret"></span><output id="o-ret"></output></label>
        <input id="ret" type="range" min="60" max="72" step="1" value="65"><span class="hint" data-i18n="h_ret"></span></div>
      <div class="ctl"><label for="prem"><span data-i18n="l_prem"></span><output id="o-prem"></output></label>
        <input id="prem" type="range" min="0" max="2" step="0.1" value="0"><span class="hint" data-i18n="h_prem"></span></div>

      <div class="grp" data-i18n="g_tax"></div>
      <div class="ctl"><label for="taxC"><span data-i18n="l_taxC"></span><output id="o-taxC"></output></label>
        <input id="taxC" type="range" min="8" max="25" step="1" value="10"><span class="hint" id="h-taxC"></span></div>
      <div class="ctl"><label for="taxOth"><span data-i18n="l_taxOth"></span><output id="o-taxOth"></output></label>
        <input id="taxOth" type="range" min="-20" max="30" step="1" value="0"><span class="hint" data-i18n="h_taxOth"></span></div>

      <div class="grp" data-i18n="g_fin"></div>
      <div class="ctl"><label for="yld"><span data-i18n="l_yld"></span><output id="o-yld"></output></label>
        <input id="yld" type="range" min="0" max="6" step="0.1" value="2.5"><span class="hint" data-i18n="h_yld"></span></div>
      <div class="ctl"><label for="infl"><span data-i18n="l_infl"></span><output id="o-infl"></output></label>
        <input id="infl" type="range" min="0" max="5" step="0.1" value="2"><span class="hint" data-i18n="h_infl"></span></div>

      <div class="grp" data-i18n="g_gro"></div>
      <div class="ctl"><label for="prod"><span data-i18n="l_prod"></span><output id="o-prod"></output></label>
        <input id="prod" type="range" min="0" max="2" step="0.1" value="0.9"><span class="hint" data-i18n="h_prod"></span></div>

      <details>
        <summary data-i18n="more"></summary>
        <div class="ctl"><label for="mig"><span data-i18n="l_mig"></span><output id="o-mig"></output></label>
          <input id="mig" type="range" min="0" max="2" step="0.1" value="1"><span class="hint" data-i18n="h_mig"></span></div>
        <div class="ctl"><label for="ramp"><span data-i18n="l_ramp"></span><output id="o-ramp"></output></label>
          <input id="ramp" type="range" min="1" max="25" step="1" value="10"><span class="hint" data-i18n="h_ramp"></span></div>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <section class="s">
    <h2 data-i18n="trends"></h2>
    <p class="note" data-i18n="chartKey"></p>

    <h3 class="gh" data-i18n="gh1"></h3>
    <div class="grid">
      <figure><h3 data-i18n="t_pop"></h3><p class="cap" data-i18n="c_pop"></p><div class="ro" id="ro-pop"></div><svg class="chart" id="c-pop" role="img"></svg></figure>
      <figure><h3 data-i18n="t_dep"></h3><p class="cap" data-i18n="c_dep"></p><div class="ro" id="ro-dep"></div><svg class="chart" id="c-dep" role="img"></svg></figure>
    </div>

    <h3 class="gh" data-i18n="gh2"></h3>
    <div class="grid">
      <figure><h3 data-i18n="t_real"></h3><p class="cap" data-i18n="c_real"></p><div class="ro" id="ro-real"></div><svg class="chart" id="c-real" role="img"></svg></figure>
      <figure><h3 data-i18n="t_ben"></h3><p class="cap" data-i18n="c_ben"></p><div class="ro" id="ro-ben"></div><svg class="chart" id="c-ben" role="img"></svg></figure>
      <figure><h3 data-i18n="t_repl"></h3><p class="cap" data-i18n="c_repl"></p><div class="ro" id="ro-repl"></div><svg class="chart" id="c-repl" role="img"></svg></figure>
    </div>

    <h3 class="gh" data-i18n="gh3"></h3>
    <div class="grid">
      <figure><h3 data-i18n="t_pb"></h3><p class="cap" data-i18n="c_pb"></p><div class="ro" id="ro-pb"></div><svg class="chart" id="c-pb" role="img"></svg></figure>
      <figure><h3 data-i18n="t_debt"></h3><p class="cap" data-i18n="c_debt"></p><div class="ro" id="ro-debt"></div><svg class="chart" id="c-debt" role="img"></svg></figure>
      <figure><h3 data-i18n="t_int"></h3><p class="cap" data-i18n="c_int"></p><div class="ro" id="ro-int"></div><svg class="chart" id="c-int" role="img"></svg></figure>
    </div>
  </section>

  <section class="s">
    <h2 data-i18n="glH"></h2>
    <dl class="gl" id="gl"></dl>
  </section>

  <section class="s">
    <h2 data-i18n="cmpH"></h2>
    <p data-i18n="cmpP"></p>
    <div class="tablewrap"><table id="cmp"></table></div>
    <p class="prose" data-i18n="cmpTake1"></p>
    <p class="prose" data-i18n="cmpTake2"></p>
    <p class="prose" data-i18n="cmpTake3"></p>
  </section>

  <section class="s">
    <h2 data-i18n="chkH"></h2>
    <p data-i18n="chkP"></p>
    <div class="tablewrap"><table id="check"></table></div>
    <p class="prose" data-i18n="chkTake"></p>
    <p class="prose" data-i18n="ancP"></p>
    <div class="tablewrap"><table id="anchors"></table></div>
  </section>

  <section class="s">
    <h2 data-i18n="limH"></h2>
    <ul class="limits" id="limits"></ul>
  </section>

  <section class="s">
    <h2 data-i18n="srcH"></h2>
    <p class="src" id="src"></p>
  </section>

  <footer data-i18n="foot"></footer>
</div>

<script>
/* jpabm-js: JavaScript port of the Python model (jpabm/model.py). Same equations, same calibration. */
const JPABM = (function () {
  const MAXAGE = 120, YEAR0 = 2020;
  const POP_2020 = 126146000, FOREIGN_2040 = 163791;
  const ASFR_BANDS = { 15: 0.0025, 20: 0.0230, 25: 0.0747, 30: 0.0973, 35: 0.0553, 40: 0.0118, 45: 0.0004 };
  const TFR_TABLE = 5 * Object.values(ASFR_BANDS).reduce((a, b) => a + b, 0);
  const ASFR = new Float64Array(MAXAGE + 1);
  for (const lo of Object.keys(ASFR_BANDS)) { const l = +lo, h = l === 45 ? 50 : l + 5; for (let a = l; a < h; a++) ASFR[a] = ASFR_BANDS[lo]; }
  const PYRAMID = [[0, 2406000, 2288000], [5, 2580000, 2462000], [10, 2736000, 2605000], [15, 2932000, 2792000], [20, 3298000, 3089000],
    [25, 3240000, 3036000], [30, 3391000, 3244000], [35, 3767000, 3665000], [40, 4289000, 4183000], [45, 4954000, 4847000],
    [50, 4353000, 4305000], [55, 3905000, 3913000], [60, 3674000, 3770000], [65, 4047000, 4305000], [70, 4288000, 4798000],
    [75, 3193000, 3953000], [80, 2239000, 3159000]];
  const P85 = [[85, 3717], [90, 1822], [95, 519], [100, 76]], P85M = 1856000, P85F = 3776000;
  const REGION_SHARE0 = [0.29, 0.20, 0.30, 0.21];
  const FRAW = [0.85, 0.95, 1.0, 1.15];
  const FDEN = FRAW.reduce((s, v, i) => s + v * REGION_SHARE0[i], 0);
  const REGION_FERT = FRAW.map(v => v / FDEN);
  const REGION_WAGE = [1.25, 1.10, 0.95, 0.80];
  const MIGRATION = [[[1, 0.003], [2, 0.006]], [[0, 0.020], [2, 0.006]], [[1, 0.030], [0, 0.035], [3, 0.004]], [[2, 0.055], [1, 0.010], [0, 0.015]]];
  const MORT = { A: 3e-4, c: 0.13, B: [1.689936239133019e-06, 7.449900742893467e-07], shift: [4.421515844583247, 4.337088057810469] };
  const FIRST_MARR_MEAN = [31.1, 29.7], UNMARRIED = [0.266, 0.165], NONMAR = 0.02;
  const IPSS = {
    years: [2020, 2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070],
    pop: [126.146, 123.262, 120.116, 116.639, 112.837, 108.801, 104.686, 100.508, 96.148, 91.587, 86.996],
    dep: [68.0, 68.6, 69.8, 73.5, 81.6, 86.5, 89.0, 89.4, 89.3, 90.4, 91.8],
    old: [28.6, 29.6, 30.8, 32.3, 34.8, 36.3, 37.1, 37.6, 37.9, 38.4, 38.7],
  };

  function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function erf(x) { const s = x < 0 ? -1 : 1; x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
  const phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
  function poisson(lam, r) { if (lam > 200) { const u1 = r() || 1e-12, u2 = r(); return Math.max(0, Math.round(lam + Math.sqrt(lam) * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2))); }
    const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; }

  const qCache = new Map();
  function qTable(step, longev) {
    const key = Math.min(step, 50) + '|' + longev; if (qCache.has(key)) return qCache.get(key);
    const f = Math.min(step, 50) / 50, q = new Float64Array(2 * (MAXAGE + 1));
    for (let s = 0; s < 2; s++) for (let a = 0; a <= MAXAGE; a++) {
      q[s * 121 + a] = a === MAXAGE ? 1 : 1 - Math.exp(-(MORT.A + MORT.B[s] * Math.exp(MORT.c * (a - MORT.shift[s] * f * longev)))); }
    qCache.set(key, q); return q;
  }
  const mCache = new Map();
  function marriageTables(mult, sd) {
    const key = mult.toFixed(3) + '|' + sd; if (mCache.has(key)) return mCache.get(key);

    cfg.series.forEach(function (s) { for (var i = i0; i <= 50; i++) { vals.push(s.lo ? s.lo[i] : s.mean[i]); vals.push(s.hi ? s.hi[i] : s.mean[i]); } });
    if (cfg.ipss) cfg.ipss.y.forEach(function (v) { vals.push(v); });
    if (cfg.marks) cfg.marks.forEach(function (m) { vals.push(m.lo, m.hi); });
    var nt = niceTicks(Math.min.apply(null, vals), Math.max.apply(null, vals)), yl = nt.lo, yh = nt.hi;
    var X = function (y) { return L + (y - x0) / (2070 - x0) * (W - L - R); }, Y = function (v) { return T0 + (1 - (v - yl) / (yh - yl)) * (H - T0 - B); };
    var o = '';
    nt.ticks.forEach(function (tk) {
      o += '<line class="' + (Math.abs(tk) < 1e-9 && yl < 0 ? 'zero' : 'gridline') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(tk) + '" y2="' + Y(tk) + '"/><text class="tick" x="' + (L - 6) + '" y="' + (Y(tk) + 4) + '" text-anchor="end">' + (cfg.tickFmt ? cfg.tickFmt(tk) : tk) + '</text>'; });
    var ty = []; for (var y = Math.ceil((x0 + 1) / 10) * 10; y <= 2070; y += 10) ty.push(y);
    if (x0 !== 2020) ty.unshift(x0);
    ty.forEach(function (yy) { o += '<text class="tick" x="' + X(yy) + '" y="' + (H - 7) + '" text-anchor="' + (yy === x0 && x0 !== 2020 ? 'start' : 'middle') + '">' + yy + '</text>'; });
    if (selYear >= x0) o += '<line class="sel" x1="' + X(selYear) + '" x2="' + X(selYear) + '" y1="' + T0 + '" y2="' + (H - B) + '"/>';
    function path(arr) { var d = ''; for (var i = i0; i <= 50; i++) d += (i > i0 ? 'L' : 'M') + X(2020 + i).toFixed(1) + ' ' + Y(arr[i]).toFixed(1); return d; }
    cfg.series.forEach(function (s) { if (s.lo) { var d = path(s.hi); for (var i = 50; i >= i0; i--) d += 'L' + X(2020 + i).toFixed(1) + ' ' + Y(s.lo[i]).toFixed(1); o += '<path class="band" d="' + d + 'Z"/>'; } });
    if (cfg.ipss) {
      var d = ''; cfg.ipss.x.forEach(function (yy, i) { d += (i ? 'L' : 'M') + X(yy).toFixed(1) + ' ' + Y(cfg.ipss.y[i]).toFixed(1); });
      o += '<path class="ln ln-ipss" d="' + d + '"/>';
      cfg.ipss.x.forEach(function (yy, i) { o += '<circle class="dot-ipss" cx="' + X(yy).toFixed(1) + '" cy="' + Y(cfg.ipss.y[i]).toFixed(1) + '" r="2.4"/>'; });
    }
    cfg.series.forEach(function (s) { o += '<path class="ln ' + s.cls + '" d="' + path(s.mean) + '"/>'; });
    var labs = cfg.series.map(function (s) { return { y: Y(s.mean[50]), text: s.label, cls: s.lab }; });
    if (cfg.ipss) labs.push({ y: Y(cfg.ipss.y[cfg.ipss.y.length - 1]), text: cfg.ipss.label, cls: 'lab-ipss' });
    labs.sort(function (a, b) { return a.y - b.y; });
    for (var k = 1; k < labs.length; k++) if (labs[k].y - labs[k - 1].y < 14) labs[k].y = labs[k - 1].y + 14;
    labs.forEach(function (l) { o += '<text class="' + l.cls + '" x="' + (W - R + 7) + '" y="' + (l.y + 4) + '">' + l.text + '</text>'; });
    if (cfg.marks) cfg.marks.forEach(function (m) {
      var x = X(m.year);
      if (m.hi !== m.lo) o += '<line class="mk" x1="' + x + '" x2="' + x + '" y1="' + Y(m.lo) + '" y2="' + Y(m.hi) + '"/><line class="mk" x1="' + (x - 4) + '" x2="' + (x + 4) + '" y1="' + Y(m.lo) + '" y2="' + Y(m.lo) + '"/><line class="mk" x1="' + (x - 4) + '" x2="' + (x + 4) + '" y1="' + Y(m.hi) + '" y2="' + Y(m.hi) + '"/>';
      else o += '<circle class="mk-dot" cx="' + x + '" cy="' + Y(m.lo) + '" r="3.4"/>';
      o += '<text class="mk-txt" x="' + (m.anchor === 'start' ? x + 8 : x - 8) + '" y="' + (Y((m.lo + m.hi) / 2) + 4 + (m.dy || 0)) + '" text-anchor="' + (m.anchor || 'end') + '">' + m.label + '</text>';
    });
    o += '<line class="guide" x1="0" x2="0" y1="' + T0 + '" y2="' + (H - B) + '" style="display:none"/>';
    svg.innerHTML = o;
    var guide = svg.querySelector('.guide'), fmtV = cfg.valFmt || function (v) { return v.toFixed(cfg.dec); };
    function readout(i) {
      var yr = 2020 + i, parts = [];
      cfg.series.forEach(function (s) { parts.push(s.label + ' ' + fmtV(s.mean[i])); });
      if (cfg.ipss) { var q = cfg.ipss.x.indexOf(yr); if (q >= 0) parts.push(cfg.ipss.label + ' ' + fmtV(cfg.ipss.y[q])); }
      $(cfg.ro).textContent = yr + (lang === 'ja' ? '年: ' : ': ') + parts.join(' / ');
    }
    readout(Math.max(i0, selYear - 2020));
    function yearAt(ev) { var r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W; return Math.max(x0, Math.min(2070, Math.round(x0 + (px - L) / (W - L - R) * (2070 - x0)))); }
    svg.onpointermove = function (ev) { var yr = yearAt(ev); guide.setAttribute('x1', X(yr)); guide.setAttribute('x2', X(yr)); guide.style.display = ''; readout(yr - 2020); };
    svg.onpointerleave = function () { guide.style.display = 'none'; readout(Math.max(i0, selYear - 2020)); };
    svg.onclick = function (ev) { setYear(yearAt(ev)); };
    svg.setAttribute('aria-label', t(cfg.title));
  }
  function renderCharts() {
    if (!baseline) return;
    var S = scenario || baseline, IP = JPABM.IPSS, ja = lang === 'ja', cv = ja ? 1e-4 : 1e-6, ipv = ja ? 100 : 1;
    var cvt = function (a) { return Array.prototype.map.call(a, function (v) { return v * cv; }); };
    var ser = function (st, key, conv) { return { mean: conv ? cvt(st[key].mean) : st[key].mean, lo: conv ? cvt(st[key].lo) : st[key].lo, hi: conv ? cvt(st[key].hi) : st[key].hi }; };
    var mk = function (st, key, conv) { var s = ser(st, key, conv); return [{ label: t('s_base'), lab: 'lab-base', cls: 'ln-base', mean: (conv ? cvt(baseline[key].mean) : baseline[key].mean) },
      { label: t('s_you'), lab: 'lab-you', cls: 'ln-you', mean: s.mean, lo: s.lo, hi: s.hi }]; };
    var ipss = function (arr, mult) { return { x: IP.years, y: arr.map(function (v) { return v * mult; }), label: t('s_ipss') }; };
    var p1 = function (v) { return v.toFixed(1) + '%'; }, p0 = function (v) { return Math.round(v) + '%'; };
    drawChart({ id: 'c-pop', ro: 'ro-pop', title: 't_pop', dec: ja ? 0 : 1, L: ja ? 48 : 42, series: mk(S, 'pop', true), ipss: ipss(IP.pop, ipv), tickFmt: ja ? comma : null, valFmt: ja ? comma : f1 });
    drawChart({ id: 'c-dep', ro: 'ro-dep', title: 't_dep', dec: 1, series: mk(S, 'dep'), ipss: ipss(IP.dep, 1) });
    drawChart({ id: 'c-real', ro: 'ro-real', title: 't_real', x0: 2024, dec: 1, series: mk(S, 'f_real') });
    drawChart({ id: 'c-ben', ro: 'ro-ben', title: 't_ben', x0: 2024, dec: 1, series: mk(S, 'f_benpct'), tickFmt: p0, valFmt: p1 });
    drawChart({ id: 'c-repl', ro: 'ro-repl', title: 't_repl', x0: 2024, dec: 1, L: 46, series: mk(S, 'repl'), tickFmt: p0, valFmt: p1,
      marks: [{ year: 2024, lo: 61.2, hi: 61.2, label: t('mk24'), anchor: 'start', dy: -12 }, { year: 2060, lo: 50.4, hi: 57.6, label: t('mk60'), anchor: 'end', dy: -10 }] });
    drawChart({ id: 'c-pb', ro: 'ro-pb', title: 't_pb', x0: 2024, dec: 1, L: 46, series: mk(S, 'f_pb'), tickFmt: p1, valFmt: p1 });
    drawChart({ id: 'c-debt', ro: 'ro-debt', title: 't_debt', x0: 2024, dec: 0, L: 50, series: mk(S, 'f_debtgdp'), tickFmt: p0, valFmt: p0 });
    drawChart({ id: 'c-int', ro: 'ro-int', title: 't_int', x0: 2024, dec: 1, L: 46, series: mk(S, 'f_inttax'), tickFmt: p0, valFmt: p1 });
  }

  /* ------------------------------------------------------------------ tables and static text */
  function renderTables() {
    var ja = lang === 'ja', cols = t('cmpCols'), at = function (r, k, y) { return CMP[r][k]; };
    var keys = CMP_ROWS.map(function (r) { return r[0]; }), col = function (k) { return keys.map(function (r) { return CMP[r][k]; }); };
    var best = { pop70: Math.max.apply(null, col('pop70')), dep70: Math.min.apply(null, col('dep70')), real70: Math.max.apply(null, col('real70')), debt70: Math.min.apply(null, col('debt70')), it50: Math.min.apply(null, col('it50')) };
    var h = '<thead><tr>' + cols.map(function (c) { return '<th scope="col">' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
    CMP_ROWS.forEach(function (r, i) {
      var d = CMP[r[0]], cl = function (k) { return d[k] === best[k] ? ' class="best"' : ''; };

    $('gl').innerHTML = t('gl').map(function (g) { return '<div><dt>' + g[0] + '</dt><dd>' + g[1] + '</dd></div>'; }).join('');
    var ac = t('ancCols');
    $('anchors').innerHTML = '<thead><tr>' + ac.map(function (c) { return '<th scope="col">' + c + '</th>'; }).join('') + '</tr></thead><tbody>' + t('anc').map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</tbody>';
    $('src').innerHTML = SRC[lang];
    if (baseline) {
      var IP = JPABM.IPSS, cc = t('chkCols'), hh = '<thead><tr>' + cc.map(function (c) { return '<th scope="col">' + c + '</th>'; }).join('') + '</tr></thead><tbody>';
      [2030, 2040, 2050, 2060, 2070].forEach(function (y) {
        var i = y - 2020, k = IP.years.indexOf(y), pm = baseline.pop.mean[i] / 1e6;
        hh += '<tr><td>' + y + '</td><td>' + (ja ? comma(pm * 100) + ' / ' + comma(IP.pop[k] * 100) : pm.toFixed(1) + ' / ' + IP.pop[k].toFixed(1)) + '</td><td>' + f1(baseline.dep.mean[i]) + ' / ' + f1(IP.dep[k]) + '</td><td>' + f1(baseline.s65.mean[i]) + ' / ' + f1(IP.old[k]) + '</td></tr>';
      });

  }
  function applyText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.innerHTML = T[lang][el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    $('play').textContent = playTimer ? t('pause') : t('play');
    $('year').setAttribute('aria-label', lang === 'ja' ? '年' : 'Year');
    $('presets').setAttribute('aria-label', lang === 'ja' ? 'よく使う組み合わせ' : 'Quick picks');
    labels(); renderTables();
  }
  function renderAll() { renderYear(); renderCharts(); renderTables(); }

  /* ------------------------------------------------------------------ wiring */
  CTL.forEach(function (id) {
    $(id).addEventListener('input', function () { labels(); document.querySelectorAll('#presets .pick').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); schedule(); });
  });
  document.querySelectorAll('#presets .pick').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#presets .pick').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      setControls(PRESETS[b.getAttribute('data-p')]); schedule();
    });
  });
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang'); try { localStorage.setItem('minijapan-lang', lang); } catch (e) {}
      applyText(); if (baseline) renderAll(); if (scenario || !baseline) status(baseline ? doneText() : calcText(0));
    });
  });
  $('year').addEventListener('input', function () { if (playTimer) togglePlay(); setYear(+$('year').value); });
  $('play').addEventListener('click', togglePlay);
  window.addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(function () { if (baseline) { drawPyramid(); renderCharts(); } }, 150); });

  applyText(); setControls(PRESETS.imm10);
  compute(toParams(PRESETS.base), 5000, function (s) {
    baseline = s; scenario = null; renderAll();
    compute(toParams(readControls()), 5000, function (s2) { scenario = s2; renderAll(); status(doneText()); }, scnTok);
  }, baseTok);
})();
