<style>
:root {
  color-scheme: light;
  --paper: #FFFFFF; --ink: #0B1F3A; --muted: #4B5C74; --rule: #D8DFEA; --navy: #1B3C7B; --base: #8A9AB2; --soft: #F3F6FB;

  --ja: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --en: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ja); font-size: 16px; line-height: 1.8;
  padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
html[lang="en"] body { font-family: var(--en); line-height: 1.6; }
.page { max-width: 1180px; margin-inline: auto; padding-block: 18px 72px; }
h1, h2, h3, p, ul, dl, dd, figure { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.brand { font-weight: 700; font-size: 17px; }
.lang { display: flex; gap: 16px; }
.pick { background: none; border: 0; padding: 0; cursor: pointer; color: var(--navy); text-align: left; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.pick[aria-pressed="true"] { color: var(--ink); font-weight: 700; text-decoration-thickness: 2px; }

h1 { margin-top: 40px; font-size: clamp(26px, 4.4vw, 42px); line-height: 1.3; font-weight: 700; text-wrap: balance; }
.lede { margin-top: 10px; max-width: 40em; color: var(--muted); text-wrap: pretty; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 56px; margin-top: 36px; align-items: start; }
@media (max-width: 980px) { .app { grid-template-columns: minmax(0, 1fr); gap: 40px; } }

/* controls */
.controls h2 { font-size: 20px; line-height: 1.4; }
.qs { margin-top: 10px; display: grid; gap: 2px; font-size: 15px; line-height: 1.65; }
.grp { margin-top: 28px; font-size: 15px; font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.ctl { margin-top: 16px; }
.ctl label { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; line-height: 1.5; }
.ctl output { font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy); }
.hint { display: block; color: var(--muted); font-size: 13px; line-height: 1.6; }
input[type=range] { width: 100%; accent-color: var(--navy); margin: 8px 0 4px; }
details > summary { cursor: pointer; color: var(--navy); text-decoration: underline; text-underline-offset: 4px; }
.controls details { margin-top: 28px; }
.controls details .ctl:first-of-type { margin-top: 14px; }
#status { margin-top: 22px; color: var(--muted); font-size: 13px; }

/* output */
.timebar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.timebar .lab { font-weight: 700; }
.timebar .yv { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.6em; }
.timebar input[type=range] { flex: 1 1 200px; width: auto; margin: 0; }
.play { min-width: 4.5em; padding: 3px 14px; border: 1px solid var(--ink); border-radius: 3px; background: none; cursor: pointer; }
.play:hover { background: var(--ink); color: var(--paper); }

.tabs { display: flex; flex-wrap: wrap; gap: 0 28px; margin-top: 18px; border-bottom: 1px solid var(--rule); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 0 7px; cursor: pointer; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--navy); }
.panel { margin-top: 44px; scroll-margin-top: 12px; }
.panel:first-of-type { margin-top: 26px; }
.ph { font-size: 24px; line-height: 1.4; margin-bottom: 8px; }
.ph.sm { font-size: 19px; }
.panel.sub { margin-top: 72px; padding-top: 26px; border-top: 1px solid var(--rule); }
.jump { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 14px; font-size: 15px; }

.panel[hidden] { display: none; }
.lead { max-width: 40em; color: var(--muted); text-wrap: pretty; }

.rows { margin-top: 18px; display: grid; gap: 14px 0; max-width: 700px; }
.rows .r { display: grid; grid-template-columns: minmax(0, 1fr) 8.5em 8.5em; gap: 0 12px; align-items: baseline; }
.rows .rh { font-size: 13px; color: var(--muted); font-weight: 700; }
.rows .rh span:not(:first-child) { text-align: right; }
.rows dt { font-weight: 700; }
.rows dt small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; line-height: 1.55; }
.rows dd { text-align: right; font-variant-numeric: tabular-nums; font-size: 17px; }
.rows dd.d { color: var(--muted); }
.rows .tot { border-top: 2px solid var(--ink); padding-top: 12px; }
.rows .tot dd { font-weight: 700; }
@media (max-width: 560px) { .rows .r { grid-template-columns: minmax(0, 1fr) 6.2em 6.2em; gap: 0 8px; } .rows dd { font-size: 15px; } }

.cmpmet { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 16px; }
.cmprows { margin-top: 18px; max-width: 760px; display: grid; gap: 10px 0; }
.cmprow { display: grid; grid-template-columns: 15em minmax(0, 1fr) 6.5em; gap: 0 14px; align-items: center; }
.cmprow .nm { line-height: 1.5; }
.cmprow .nm small { display: block; color: var(--muted); font-size: 12.5px; }
.cmprow .tr { position: relative; height: 18px; border-left: 1px solid var(--ink); background: linear-gradient(var(--soft), var(--soft)) left center / 100% 100% no-repeat; }
.cmprow .tr i { position: absolute; top: 2px; height: 14px; background: var(--navy); opacity: .85; }
.cmprow .vl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.cmpst { margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 1.6em; }
@media (max-width: 640px) { .cmprow { grid-template-columns: minmax(0, 1fr) 6em; } .cmprow .tr { grid-column: 1 / -1; grid-row: 2; } }
.hhsel { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 16px; }
.hhin { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: end; }
.hhin label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.hhin input[type=number] { width: 7.5em; padding: 4px 2px; border: 0; border-bottom: 1px solid var(--ink); background: var(--soft); font-size: 17px; font-variant-numeric: tabular-nums; border-radius: 0; }
.hhin .chk { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; padding-bottom: 5px; }
.note { margin-top: 14px; color: var(--muted); font-size: 13.5px; line-height: 1.7; max-width: 44em; text-wrap: pretty; }

.charts { margin-top: 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 36px; }
.charts.one { grid-template-columns: minmax(0, 1fr); max-width: 640px; }
@media (max-width: 1100px) { .charts { grid-template-columns: minmax(0, 1fr); } }
figure h3 { font-size: 17px; line-height: 1.5; }
figure .cap { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin-top: 2px; max-width: 34em; }
.ro { margin-top: 8px; min-height: 1.7em; font-size: 14px; font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; }
#pyr { margin-top: 8px; min-height: 380px; }
.pyrwrap { max-width: 680px; }

.gridline { stroke: var(--rule); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; } .agelab { fill: var(--muted); font-size: 11px; }
.head { fill: var(--ink); font-size: 13px; font-weight: 700; }
.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ln-you { stroke: var(--navy); stroke-width: 2.6; } .ln-base { stroke: var(--base); stroke-width: 1.7; }
.ln-ipss { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dot-ipss { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.band { fill: var(--navy-soft); } .sel { stroke: var(--ink); stroke-width: 1; opacity: .35; } .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.lab-you { fill: var(--navy); font-size: 12px; font-weight: 700; } .lab-base { fill: var(--muted); font-size: 12px; } .lab-ipss { fill: var(--ink); font-size: 12px; }
.mk { stroke: var(--ink); stroke-width: 1.6; fill: none; } .mk-dot { fill: var(--ink); } .mk-txt { fill: var(--ink); font-size: 11px; }
.zero { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.bar { fill: var(--navy); opacity: .82; } .bar-base { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.chart { cursor: crosshair; }

.about { margin-top: 72px; border-top: 1px solid var(--rule); padding-top: 20px; max-width: 46em; }
.about ul { margin-top: 14px; padding-left: 1.2em; display: grid; gap: 8px; font-size: 15px; }
.about h3 { margin-top: 22px; font-size: 16px; }
.about .src a { color: var(--navy); text-underline-offset: 3px; }
.about .src { margin-top: 8px; font-size: 14px; }
footer { margin-top: 32px; color: var(--muted); font-size: 13px; max-width: 46em; }
</style>

<body>
<div class="page">
  <header class="top">
    <span class="brand">Mini Japan</span>
    <div class="lang" role="group" aria-label="Language">
      <a class="pick" href="https://github.com/miraemog/jpabm" target="_blank" rel="noopener">GitHub</a>
      <button class="pick" data-lang="ja" aria-pressed="true">日本語</button>
      <button class="pick" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <h1 data-i18n="h1"></h1>
  <p class="lede" data-i18n="lede"></p>

  <div class="app">
    <form class="controls" onsubmit="return false">
      <h2 data-i18n="try"></h2>
      <div class="qs" id="presets" role="group">
        <button class="pick" type="button" data-p="base" aria-pressed="false" data-i18n="p_base"></button>
        <button class="pick" type="button" data-p="tax15" aria-pressed="true" data-i18n="p_tax"></button>
        <button class="pick" type="button" data-p="ret68" aria-pressed="false" data-i18n="p_ret"></button>
        <button class="pick" type="button" data-p="yld4" aria-pressed="false" data-i18n="p_yld"></button>
        <button class="pick" type="button" data-p="infl3" aria-pressed="false" data-i18n="p_infl"></button>
        <button class="pick" type="button" data-p="prod15" aria-pressed="false" data-i18n="p_prod"></button>
        <button class="pick" type="button" data-p="imm10" aria-pressed="false" data-i18n="p_imm"></button>
        <button class="pick" type="button" data-p="births10" aria-pressed="false" data-i18n="p_births"></button>
        <button class="pick" type="button" data-p="trend" aria-pressed="false" data-i18n="p_trend"></button>
      </div>

      <div class="grp" data-i18n="g_tax"></div>
      <div class="ctl"><label for="taxC"><span data-i18n="l_taxC"></span><output id="o-taxC"></output></label>
        <input id="taxC" type="range" min="8" max="25" step="1" value="10"><span class="hint" id="h-taxC"></span></div>
      <div class="ctl"><label for="taxOth"><span data-i18n="l_taxOth"></span><output id="o-taxOth"></output></label>
        <input id="taxOth" type="range" min="-20" max="30" step="1" value="0"><span class="hint" data-i18n="h_taxOth"></span></div>

      <div class="grp" data-i18n="g_pen"></div>
      <div class="ctl"><label for="ret"><span data-i18n="l_ret"></span><output id="o-ret"></output></label>
        <input id="ret" type="range" min="60" max="72" step="1" value="65"><span class="hint" data-i18n="h_ret"></span></div>
      <div class="ctl"><label for="prem"><span data-i18n="l_prem"></span><output id="o-prem"></output></label>
        <input id="prem" type="range" min="0" max="2" step="0.1" value="0"><span class="hint" id="h-prem"></span></div>

      <div class="grp" data-i18n="g_fin"></div>
      <div class="ctl"><label for="yld"><span data-i18n="l_yld"></span><output id="o-yld"></output></label>
        <input id="yld" type="range" min="0" max="6" step="0.1" value="2.5"><span class="hint" data-i18n="h_yld"></span></div>
      <div class="ctl"><label for="infl"><span data-i18n="l_infl"></span><output id="o-infl"></output></label>
        <input id="infl" type="range" min="0" max="5" step="0.1" value="2"><span class="hint" data-i18n="h_infl"></span></div>

      <div class="grp" data-i18n="g_gro"></div>
      <div class="ctl"><label for="prod"><span data-i18n="l_prod"></span><output id="o-prod"></output></label>
        <input id="prod" type="range" min="0" max="2" step="0.1" value="0.9"><span class="hint" data-i18n="h_prod"></span></div>

      <div class="grp" data-i18n="g_pop"></div>
      <div class="ctl"><label for="tfr"><span data-i18n="l_tfr"></span><output id="o-tfr"></output></label>
        <input id="tfr" type="range" min="-0.4" max="0.6" step="0.01" value="0"><span class="hint" id="h-tfr"></span></div>
      <div class="ctl"><label for="imm"><span data-i18n="l_imm"></span><output id="o-imm"></output></label>
        <input id="imm" type="range" min="0" max="45" step="0.1" value="16.4"><span class="hint" data-i18n="h_imm"></span></div>
      <div class="ctl"><label for="marr"><span data-i18n="l_marr"></span><output id="o-marr"></output></label>
        <input id="marr" type="range" min="0.8" max="1.15" step="0.01" value="1"><span class="hint" id="h-marr"></span></div>

      <details>
        <summary data-i18n="more"></summary>
        <div class="ctl"><label for="mig"><span data-i18n="l_mig"></span><output id="o-mig"></output></label>
          <input id="mig" type="range" min="0" max="2" step="0.1" value="1"><span class="hint" data-i18n="h_mig"></span></div>
        <div class="ctl"><label for="ramp"><span data-i18n="l_ramp"></span><output id="o-ramp"></output></label>
          <input id="ramp" type="range" min="1" max="25" step="1" value="10"><span class="hint" data-i18n="h_ramp"></span></div>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <div class="out">
      <div class="timebar">
        <span class="lab" data-i18n="yearLab"></span><span class="yv" id="yv">2040</span>
        <input id="year" type="range" min="2020" max="2070" step="1" value="2040">
        <button class="play" id="play" type="button"></button>
      </div>

      <nav class="jump" id="jump"><a href="#p-pop" data-i18n="tab_pop"></a><a href="#p-eco" data-i18n="tab_eco"></a><a href="#p-fin" data-i18n="tab_fin"></a><a href="#p-cmp" data-i18n="tab_cmp"></a><a href="#p-hh" data-i18n="tab_hh_sub"></a></nav>



      <section class="panel macro" id="p-pop">
        <h2 class="ph" data-i18n="tab_pop"></h2>
        <p class="lead" data-i18n="popLead"></p>
        <div class="pyrwrap"><svg id="pyr" role="img"></svg><p class="note" data-i18n="pyrKey"></p></div>
        <dl class="rows" id="rows-pop"></dl>
        <div class="charts">
          <figure><h3 data-i18n="t_pop"></h3><p class="cap" data-i18n="c_pop"></p><div class="ro" id="ro-pop"></div><svg class="chart" id="c-pop" role="img"></svg></figure>
          <figure><h3 data-i18n="t_dep"></h3><p class="cap" data-i18n="c_dep"></p><div class="ro" id="ro-dep"></div><svg class="chart" id="c-dep" role="img"></svg></figure>
        </div>
      </section>
      <section class="panel macro" id="p-eco">
        <h2 class="ph" data-i18n="tab_eco"></h2>
        <p class="lead" data-i18n="ecoLead"></p>
        <dl class="rows" id="rows-eco"></dl>
        <div class="charts">
          <figure><h3 data-i18n="t_real"></h3><p class="cap" data-i18n="c_real"></p><div class="ro" id="ro-real"></div><svg class="chart" id="c-real" role="img"></svg></figure>
          <figure><h3 data-i18n="t_ben"></h3><p class="cap" data-i18n="c_ben"></p><div class="ro" id="ro-ben"></div><svg class="chart" id="c-ben" role="img"></svg></figure>
          <figure><h3 data-i18n="t_repl"></h3><p class="cap" data-i18n="c_repl"></p><div class="ro" id="ro-repl"></div><svg class="chart" id="c-repl" role="img"></svg></figure>
        </div>
      </section>
      <section class="panel macro" id="p-fin">
        <h2 class="ph" data-i18n="tab_fin"></h2>
        <p class="lead" data-i18n="finLead"></p>
        <dl class="rows" id="rows-fin"></dl>
        <div class="charts">
          <figure><h3 data-i18n="t_pb"></h3><p class="cap" data-i18n="c_pb"></p><div class="ro" id="ro-pb"></div><svg class="chart" id="c-pb" role="img"></svg></figure>
          <figure><h3 data-i18n="t_debt"></h3><p class="cap" data-i18n="c_debt"></p><div class="ro" id="ro-debt"></div><svg class="chart" id="c-debt" role="img"></svg></figure>
          <figure><h3 data-i18n="t_int"></h3><p class="cap" data-i18n="c_int"></p><div class="ro" id="ro-int"></div><svg class="chart" id="c-int" role="img"></svg></figure>
        </div>
      </section>
      <section class="panel macro" id="p-cmp">
        <h2 class="ph" data-i18n="tab_cmp"></h2>
        <p class="lead" data-i18n="cmpLead"></p>
        <div class="cmpmet" id="cmpmet" role="group">
          <button class="pick" type="button" data-m="f_debtgdp" aria-pressed="true" data-i18n="r_debt"></button>
          <button class="pick" type="button" data-m="f_inttax" aria-pressed="false" data-i18n="r_int"></button>
          <button class="pick" type="button" data-m="f_real" aria-pressed="false" data-i18n="r_real"></button>
          <button class="pick" type="button" data-m="repl" aria-pressed="false" data-i18n="r_repl"></button>
          <button class="pick" type="button" data-m="pop" aria-pressed="false" data-i18n="r_pop"></button>
          <button class="pick" type="button" data-m="dep" aria-pressed="false" data-i18n="r_dep"></button>
        </div>
        <p class="note" id="cmpgloss"></p>
        <div class="cmprows" id="cmprows"></div>
        <p class="cmpst" id="cmpst" role="status"></p>
        <p class="note" data-i18n="cmpNote"></p>
      </section>

      <section class="panel sub" id="p-hh">
        <h2 class="ph sm" data-i18n="tab_hh_sub"></h2>
        <p class="lead" data-i18n="hhLead"></p>
        <div class="hhsel" id="hhsel" role="group">
          <button class="pick" type="button" data-h="family" aria-pressed="true" data-i18n="h_family"></button>
          <button class="pick" type="button" data-h="single" aria-pressed="false" data-i18n="h_single"></button>
          <button class="pick" type="button" data-h="pension" aria-pressed="false" data-i18n="h_pension"></button>
        </div>
        <div class="hhin">

      cfg.ipss.x.forEach(function (yy, i) { o += '<circle class="dot-ipss" cx="' + X(yy).toFixed(1) + '" cy="' + Y(cfg.ipss.y[i]).toFixed(1) + '" r="2.4"/>'; });
    }
    cfg.series.forEach(function (s) { o += '<path class="ln ' + s.cls + '" d="' + path(s.mean) + '"/>'; });
    var labs = cfg.series.map(function (s) { return { y: Y(s.mean[50]), text: s.label, cls: s.lab }; });
    if (cfg.ipss) labs.push({ y: Y(cfg.ipss.y[cfg.ipss.y.length - 1]), text: cfg.ipss.label, cls: 'lab-ipss' });
    labs.sort(function (a, b) { return a.y - b.y; });
    for (var k = 1; k < labs.length; k++) if (labs[k].y - labs[k - 1].y < 14) labs[k].y = labs[k - 1].y + 14;
    labs.forEach(function (l) { o += '<text class="' + l.cls + '" x="' + (W - R + 7) + '" y="' + (l.y + 4) + '">' + l.text + '</text>'; });
    if (cfg.marks) cfg.marks.forEach(function (m) {
      var x = X(m.year);
      if (m.hi !== m.lo) o += '<line class="mk" x1="' + x + '" x2="' + x + '" y1="' + Y(m.lo) + '" y2="' + Y(m.hi) + '"/><line class="mk" x1="' + (x - 4) + '" x2="' + (x + 4) + '" y1="' + Y(m.lo) + '" y2="' + Y(m.lo) + '"/><line class="mk" x1="' + (x - 4) + '" x2="' + (x + 4) + '" y1="' + Y(m.hi) + '" y2="' + Y(m.hi) + '"/>';
      else o += '<circle class="mk-dot" cx="' + x + '" cy="' + Y(m.lo) + '" r="3.4"/>';
      o += '<text class="mk-txt" x="' + (m.anchor === 'start' ? x + 8 : x - 8) + '" y="' + (Y((m.lo + m.hi) / 2) + 4 + (m.dy || 0)) + '" text-anchor="' + (m.anchor || 'end') + '">' + m.label + '</text>';
    });
    o += '<line class="guide" x1="0" x2="0" y1="' + T0 + '" y2="' + (H - B) + '" style="display:none"/>';
    svg.innerHTML = o;
    var guide = svg.querySelector('.guide'), fmtV = cfg.valFmt || function (v) { return v.toFixed(cfg.dec); };
    function readout(i) {
      var yr = 2020 + i, parts = [];
      cfg.series.forEach(function (s) { parts.push(s.label + ' ' + fmtV(s.mean[i])); });
      if (cfg.ipss) { var q = cfg.ipss.x.indexOf(yr); if (q >= 0) parts.push(cfg.ipss.label + ' ' + fmtV(cfg.ipss.y[q])); }
      $(cfg.ro).textContent = yr + (lang === 'ja' ? '年: ' : ': ') + parts.join(' / ');
    }
    readout(Math.max(i0, selYear - 2020));
    function yearAt(ev) { var r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W; return Math.max(x0, Math.min(2070, Math.round(x0 + (px - L) / (W - L - R) * (2070 - x0)))); }
    svg.onpointermove = function (ev) { var yr = yearAt(ev); guide.setAttribute('x1', X(yr)); guide.setAttribute('x2', X(yr)); guide.style.display = ''; readout(yr - 2020); };
    svg.onpointerleave = function () { guide.style.display = 'none'; readout(Math.max(i0, selYear - 2020)); };
    svg.onclick = function (ev) { setYear(yearAt(ev)); };
    svg.setAttribute('aria-label', t(cfg.title));
  }
  function renderCharts() {
    var S = scenario || baseline, IP = JPABM.IPSS, ja = lang === 'ja', cv = ja ? 1e-4 : 1e-6, ipv = ja ? 100 : 1;
    var cvt = function (a) { return Array.prototype.map.call(a, function (v) { return v * cv; }); };
    var ser = function (st, key, conv) { return { mean: conv ? cvt(st[key].mean) : st[key].mean, lo: conv ? cvt(st[key].lo) : st[key].lo, hi: conv ? cvt(st[key].hi) : st[key].hi }; };
    var mk = function (st, key, conv) { var s = ser(st, key, conv); return [{ label: t('s_base'), lab: 'lab-base', cls: 'ln-base', mean: (conv ? cvt(baseline[key].mean) : baseline[key].mean) },
      { label: t('s_you'), lab: 'lab-you', cls: 'ln-you', mean: s.mean, lo: s.lo, hi: s.hi }]; };
    var ipss = function (arr, mult) { return { x: IP.years, y: arr.map(function (v) { return v * mult; }), label: t('s_ipss') }; };
    var p1 = function (v) { return v.toFixed(1) + '%'; }, p0 = function (v) { return Math.round(v) + '%'; };
    {
      drawChart({ id: 'c-pop', ro: 'ro-pop', title: 't_pop', dec: ja ? 0 : 1, L: ja ? 48 : 42, series: mk(S, 'pop', true), ipss: ipss(IP.pop, ipv), tickFmt: ja ? comma : null, valFmt: ja ? comma : f1 });
      drawChart({ id: 'c-dep', ro: 'ro-dep', title: 't_dep', dec: 1, series: mk(S, 'dep'), ipss: ipss(IP.dep, 1) });
    }
    {
      drawChart({ id: 'c-real', ro: 'ro-real', title: 't_real', x0: 2024, dec: 1, series: mk(S, 'f_real') });
      drawChart({ id: 'c-ben', ro: 'ro-ben', title: 't_ben', x0: 2024, dec: 1, series: mk(S, 'f_benpct'), tickFmt: p0, valFmt: p1 });
      drawChart({ id: 'c-repl', ro: 'ro-repl', title: 't_repl', x0: 2024, dec: 1, L: 46, series: mk(S, 'repl'), tickFmt: p0, valFmt: p1,
        marks: [{ year: 2024, lo: 61.2, hi: 61.2, label: t('mk24'), anchor: 'start', dy: -12 }, { year: 2060, lo: 50.4, hi: 57.6, label: t('mk60'), anchor: 'end', dy: -10 }] });
    }
    {
      drawChart({ id: 'c-pb', ro: 'ro-pb', title: 't_pb', x0: 2024, dec: 1, L: 46, series: mk(S, 'f_pb'), tickFmt: p1, valFmt: p1 });
      drawChart({ id: 'c-debt', ro: 'ro-debt', title: 't_debt', x0: 2024, dec: 0, L: 50, series: mk(S, 'f_debtgdp'), tickFmt: p0, valFmt: p0 });
      drawChart({ id: 'c-int', ro: 'ro-int', title: 't_int', x0: 2024, dec: 1, L: 46, series: mk(S, 'f_inttax'), tickFmt: p0, valFmt: p1 });
    }
  }


  /* ------------------------------------------------------------------ policy comparison */
  var CMPK = ['trend', 'imm10', 'births10', 'ret68', 'tax15', 'infl3', 'yld4', 'prod15'], RUNS_CMP = 8, cmpRes = null, cmpMetric = 'f_debtgdp', cmpState = '';
  function computeCmp() {
    var keys = ['base'].concat(CMPK), res = {}, k = 0, r = 0, runs = [], total = keys.length * RUNS_CMP, done = 0;
    cmpRes = null; cmpState = t('cmpBusy') + '0%'; renderCmp();
    (function next() {
      var key = keys[k];
      if (!key) { cmpRes = res; cmpState = ''; renderCmp(); return; }
      if (r === 0) runs = [];
      runs.push(JPABM.run(toParams(PRESETS[key]), 5000 + r)); r++; done++;
      if (r >= RUNS_CMP) { res[key] = JPABM.stats(runs); r = 0; k++; }
      cmpState = t('cmpBusy') + Math.round(100 * done / total) + '%'; $('cmpst').textContent = cmpState;
      setTimeout(next, 0);
    })();
  }
  function renderCmp() {
    var met = { f_debtgdp: ['g_debt', 1, 'pt0'], f_inttax: ['g_int', 1, 'pt'], f_real: ['g_real', 1, 'ix'], repl: ['g_repl', 1, 'pt'], pop: ['g_pop2', 0, 'pop'], dep: ['g_dep', 1, 'ix'] }[cmpMetric];
    $('cmpgloss').textContent = t(met[0]);
    document.querySelectorAll('#cmpmet .pick').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-m') === cmpMetric ? 'true' : 'false'); });
    if (!cmpRes) { $('cmprows').innerHTML = ''; $('cmpst').textContent = cmpState; return; }
    var yi = selYear - 2020, pol = t('cmpPol'), econ = cmpMetric.indexOf('f_') === 0 || cmpMetric === 'repl';
    if (econ && yi < I0) { $('cmprows').innerHTML = ''; $('cmpst').textContent = t('cmpNA'); return; }
    var rows = CMPK.map(function (k) { return { k: k, d: cmpRes[k][cmpMetric].mean[yi] - cmpRes.base[cmpMetric].mean[yi] }; });
    rows.sort(function (a, b) { return b.d - a.d; });
    var mx = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.d); })) || 1;
    var fmt = function (d) {
      if (met[2] === 'pop') return popDiff(d);
      if (met[2] === 'ix') return signed(d, 1);
      return signed(d, met[2] === 'pt0' ? 0 : 1) + ptUnit();
    };
    var out = '';
    rows.forEach(function (r) {
      var w = Math.abs(r.d) / mx * 100, side = r.d >= 0 ? 'left:0;' : 'right:0;';
      out += '<div class="cmprow"><div class="nm">' + pol[r.k][0] + '<small>' + pol[r.k][1] + '</small></div><div class="tr" style="border-left:0;border-right:0"><span style="position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--ink)"></span><i style="' + (r.d >= 0 ? 'left:50%;' : 'right:50%;') + 'width:' + (w / 2).toFixed(1) + '%"></i></div><div class="vl">' + fmt(r.d) + '</div></div>';
    });
    $('cmprows').innerHTML = out; $('cmpst').textContent = t('cmpDone') + ' (' + selYear + ')';
  }

  /* ------------------------------------------------------------------ rendering */
  function renderActive() {
    if (!baseline) return;
    $('yv').textContent = selYear;
    renderSummaries(); renderCharts(); drawPyramid(); renderHH(); renderCmp();
    $('src').innerHTML = SRC[lang];
  }
  function setYear(y) { selYear = Math.max(2020, Math.min(2070, y)); $('year').value = selYear; renderActive(); }
  function togglePlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; $('play').textContent = t('play'); return; }
    if (selYear >= 2070) setYear(2020);
    $('play').textContent = t('pause');
    playTimer = setInterval(function () { if (selYear >= 2070) { clearInterval(playTimer); playTimer = null; $('play').textContent = t('play'); return; } setYear(selYear + 1); }, 130);
  }
  function applyText() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.innerHTML = T[lang][el.getAttribute('data-i18n')]; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    $('play').textContent = playTimer ? t('pause') : t('play');
    $('year').setAttribute('aria-label', t('yearLab'));
    $('presets').setAttribute('aria-label', t('try'));
    $('about-list').innerHTML = t('about').map(function (s) { return '<li>' + s + '</li>'; }).join('');
    hhLabel(); labels();
  }

  /* ------------------------------------------------------------------ wiring */
  CTL.forEach(function (id) {
    $(id).addEventListener('input', function () { labels(); document.querySelectorAll('#presets .pick').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); schedule(); });
  });
  document.querySelectorAll('#presets .pick').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#presets .pick').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      setControls(PRESETS[b.getAttribute('data-p')]); schedule();
    });
  });
  document.querySelectorAll('#hhsel .pick').forEach(function (b) { b.addEventListener('click', function () { setHH(b.getAttribute('data-h')); }); });
  ['h-inc', 'h-con', 'h-loan', 'h-sav', 'h-ret'].forEach(function (id) {
    $(id).addEventListener('input', function () { document.querySelectorAll('#hhsel .pick').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); hhLabel(); renderActive(); });
  });
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang'); try { localStorage.setItem('minijapan-lang', lang); } catch (e) {}
      applyText(); renderActive(); if (scenario || !baseline) status(baseline ? doneText() : calcText(0));
    });
  });
  $('year').addEventListener('input', function () { if (playTimer) togglePlay(); setYear(+$('year').value); });
  $('play').addEventListener('click', togglePlay);
  window.addEventListener('resize', function () { clearTimeout(window.__rz); window.__rz = setTimeout(renderActive, 150); });

  applyText(); setControls(PRESETS.tax15);
  compute(toParams(PRESETS.base), 5000, function (s) {
    baseline = s; scenario = null; renderActive();
    compute(toParams(readControls()), 5000, function (s2) { scenario = s2; renderActive(); status(doneText()); setTimeout(computeCmp, 300); }, scnTok);
  }, baseTok);
})();
</script>
